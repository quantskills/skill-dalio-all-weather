[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dalio-all-weather-skill"
version = "0.4.0"
description = "Research-only China all-weather allocation skill"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pandas==2.2.3",
  "numpy==2.5.1",
  "matplotlib==3.10.8",
  "pyarrow==24.0.0",
  "scipy==1.16.3",
  "tabulate==0.10.0",
  "panda_data==0.0.12",
]

[project.scripts]
dalio-all-weather = "dalio_all_weather_skill.cli:main"

[tool.setuptools]
packages = ["dalio_all_weather_skill"]

[tool.setuptools.package-dir]
dalio_all_weather_skill = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
